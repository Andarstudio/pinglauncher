name: Extract ZIP and Build Ping Launcher

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  extract-and-build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP Archive
      shell: pwsh
      run: |
        $zipFile = "PingLauncher-Complete.zip"
        $extractDir = "."
        if (Test-Path $zipFile) {
            Write-Host "Extracting $zipFile to $extractDir..."
            Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
            Write-Host "Extraction completed successfully."
        } else {
            Write-Warning "ZIP file $zipFile not found. Assuming files are already checked out directly."
        }

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore PingLauncher.sln

    - name: Build Solution
      run: dotnet build PingLauncher.sln -c Release --no-restore

    - name: Run Tests
      run: dotnet test PingLauncher.sln -c Release --no-build --verbosity normal

    - name: Publish Windows x64 App
      run: dotnet publish src/PingLauncher.App/PingLauncher.App.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PingLauncher-Windows-x64
        path: publish/win-x64/
        
